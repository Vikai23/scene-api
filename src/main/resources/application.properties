spring.application.name=scene-api

# Banco H2 em memória (recriado e repovoado a cada execução)
spring.datasource.url=jdbc:h2:mem:scenedb
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Mensagens do Bean Validation sempre em português, independente do navegador
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# A API só recebe JSON, nunca arquivos: com o multipart desligado, um corpo form-data recebe 415 como qualquer outro formato
spring.servlet.multipart.enabled=false

# Caracteres como { } [ ] | no caminho da URL passam pelo servidor mesmo sem codificação. Sem isto o Tomcat barraria
# a requisição com uma página HTML; assim ela chega à API e o erro sai no formato JSON padrão. O caso mais comum
# é colar /artists/{id} sem trocar o {id}: a resposta passa a ser 400 Bad Request, com a mensagem de id inválido
server.tomcat.relaxed-path-chars=",<,>,[,\\,],^,`,{,|,}

# Paginação: 10 itens por página por padrão, no máximo 50
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ---------- Parte 2: recursos avançados ----------

# Versionamento: feito por cabeçalho (X-API-Version), versões 1 e 2, padrão 1. Ver ApiVersionConfig.

# CORS: origens (esquema + host + porta) que podem chamar a API pelo navegador, separadas por vírgula.
# São os endereços em que a página de demonstração (pasta web/) pode ser aberta:
#   http://localhost:3000                           servidor de arquivos do JDK (web/iniciar-pagina.cmd)
#   http://localhost:63342                          servidor embutido do IntelliJ (abrir o index.html pelo ícone do navegador)
#   http://localhost:5500 e http://127.0.0.1:5500   extensão Live Server do VS Code
# Qualquer outra origem (por exemplo http://127.0.0.1:3000, ou o arquivo aberto direto do disco) recebe 403 Forbidden
scene.cors.allowed-origins=http://localhost:3000,http://localhost:63342,http://localhost:5500,http://127.0.0.1:5500

# Rate limiting (token bucket) por IP: o balde comporta "capacity" fichas e recebe "refill-tokens" fichas
# a cada "refill-period". Com 100/100/1m, o limite é de 100 requisições por minuto, com rajada de até 100.
scene.rate-limit.capacity=100
scene.rate-limit.refill-tokens=100
scene.rate-limit.refill-period=1m

# Idempotência: por quanto tempo uma chave X-Idempotency-Key fica guardada
scene.idempotency.ttl=24h

# Swagger / springdoc
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.filter=true
