spring.application.name=scene-api

# Banco H2 em memória (recriado e repovoado a cada execução)
spring.datasource.url=jdbc:h2:mem:scenedb
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Mensagens do Bean Validation sempre em português, independente do navegador
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Paginação: 10 itens por página por padrão, no máximo 50
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Swagger / springdoc
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.filter=true
